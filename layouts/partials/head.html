<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ .Params.description | default .Site.Params.description }}">
    <meta name="author" content="Chahat Sandhu">
    <meta name="robots" content="index, follow">

    <link rel="canonical" href="{{ .Permalink }}">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <!-- SEO: JSON-LD Person Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Chahat Sandhu",
      "url": "https://chahat.dev",
      "jobTitle": "Student",
      "description": "{{ .Site.Params.description }}",
      "sameAs": [
        "{{ .Site.Params.github }}",
        "{{ .Site.Params.linkedin }}"
      ]
    }
    </script>

    <title>{{ .Title }}{{ if not .IsHome }} | {{ .Site.Title }}{{ end }}</title>

    {{ $style := resources.Get "css/main.css" | minify | fingerprint }}
    <link rel="stylesheet" href="{{ $style.RelPermalink }}" fetchpriority="high">

    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';">
</head>
