{{ define "main" }}
<a href="{{ "/blog/" | relURL }}" class="back-link reveal">&larr; All writing</a>

<header class="post-header reveal">
    <time class="date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
    <h1 class="headline">{{ .Title }}</h1>
    {{ with .Params.summary }}
    <p class="tagline">{{ . }}</p>
    {{ end }}
</header>

<article class="post-body">
    {{ .Content }}
</article>
{{ end }}
