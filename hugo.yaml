baseURL: "https://your-username.codeberg.page" # CHANGE THIS later to your custom domain
languageCode: "en-us"
title: "My High-End Site"
theme: "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: My High-End Site
  description: "A site built with Hugo and Love"
  keywords: [Blog, Portfolio, PaperMod]
  author: Me
  defaultTheme: auto # dark, light, auto
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  
menu:
  main:
    - identifier: categories
      name: categories
      url: /categories/
      weight: 10
    - identifier: tags
      name: tags
      url: /tags/
      weight: 20
